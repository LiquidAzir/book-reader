# Render Blueprint for Book Reader.
# Provisions: static site (frontend) + web service (API).
# Postgres lives on Neon's free tier (migrated 2026-08 off the paid Render DB).
# Apply by pushing this file to a connected Git repo and running
# "Blueprint → New Blueprint Instance" in the Render dashboard.

services:
  # ---- Backend API ----
  - type: web
    name: book-reader-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && node src/migrate.js
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        # Neon Postgres connection URL. KEEP the ?sslmode=require query param:
        # src/db.js only forces TLS for render.com hosts, so for Neon the URL
        # itself must request SSL (node-pg reads sslmode from the query string).
        sync: false
      - key: CORS_ORIGINS
        # After first deploy of the static site, set this to its exact URL.
        # Leave as "*" while iterating to avoid CORS pain.
        value: "*"
      - key: BOOK_CACHE_MAX_ENTRIES
        value: "50"

  # ---- Frontend (static) ----
  # Note: Render static sites don't take a `plan` field — always free.
  - type: web
    name: book-reader-glasses
    runtime: static
    rootDir: glasses-app
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
